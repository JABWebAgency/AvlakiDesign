<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--Swap our for actual link-->
    <link rel="canonical" href="https://{{ client.domain }}{{ page.url }}" />

    <meta name="description" content="{{ description }}" />
    <meta name="keywords" content="{{ keywords }}" />

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5YEFXVZGW7"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-5YEFXVZGW7');
    </script>

    <!--Social Media Display-->
    <meta property="og:title" content="{{ metaTitle }}" />
    <meta property="og:description" content="{{ description }}" />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://{{ client.domain }}{{ page.url }}"
    />
    <meta
      property="og:image"
      content="https://avlakidesign.com/assets/images/avlaki.png"
    />
    <meta
      property="og:image:secure_url"
      content="https://avlakidesign.com/assets/images/avlaki.png"
    />

    <!--Favicons-->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/favicons/180.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/favicons/32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/assets/favicons/16.png"
    />
    <!-- <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicons/favicon-16x16.png"> -->
    <link rel="manifest" href="/assets/favicons/site.webmanifest" />
    <meta name="msapplication-TileColor" content="#da532c" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Preload -->
    <link rel="preload" as="image" href="/assets/favicons/180.png" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/assets/fonts/roboto-v29-latin-regular.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/assets/fonts/roboto-v29-latin-700.woff2"
      crossorigin
    />

    <link rel="stylesheet" href="/css/root.css" />

    <link rel="preload" as="image" href="{{ preloadImg }}" />

    <!-- Loading in page specific CSS sheets from css block -->
    <link rel="stylesheet" href="/css/critical.css" />
    <link rel="stylesheet" href="{{ preloadCSS }}" />
    <link rel="stylesheet" href="/css/quick-quote.css" />

    <!--Put analytics tag here at the bottom to prevent it from render blocking-->

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "HomeAndConstructionBusiness",
      "name": "{{ client.name }}",
      "description": "Expert drainage and excavation solutions serving the south metro Twin Cities area. Specializing in foundation drainage, French drains, curtain drains, grading, excavation, and water collection systems.",
      "url": "https://{{ client.domain }}",
      "telephone": "{{ client.phoneFormatted }}",
      "email": "{{ client.email }}",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "{{ client.address.lineOne }}",
        "addressLocality": "{{ client.address.city }}",
        "addressRegion": "{{ client.address.county }}",
        "postalCode": "{{ client.address.postcode }}",
        "addressCountry": "US"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 44.5433,
        "longitude": -93.5763
      },
      "areaServed": [
        {% for area in client.serviceAreas %}
        {
          "@type": "City",
          "name": "{{ area }}",
          "addressRegion": "MN"
        }{% if not loop.last %},{% endif %}
        {% endfor %}
      ],
      "sameAs": [
        "{{ client.facebook }}",
        "{{ client.instagram }}"
      ],
      "image": "https://{{ client.domain }}/assets/images/avlaki.png",
      "priceRange": "$$",
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Drainage and Excavation Services",
        "itemListElement": [
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Foundation Drainage"
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "French Drains"
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Curtain Drains"
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Downspout Drainage"
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Grading"
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Excavation"
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Exterior Sump Basins"
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Dry Well/Rain Garden"
            }
          }
        ]
      }
    }
    </script>

    <!-- For home page, use full title, including location for SEO. Other pages should just include the page name -->
    <title>
      {% if page.url == '/'%} {{ client.name }} | {{ tagTitle }} | {{
      client.address.city }}, {{ client.address.county }} {% else %} {{ tagTitle
      }} | {{ client.name }} {% endif %}
    </title>
  </head>
  <body>
    <!--Screen reader skip main nav-->
    <a class="skip" aria-label="skip to main content" href="#main"
      >Click To Skip To Main Content</a
    >

    {% include "header.html" %}
    <main id="main">{{ content | safe }}</main>
    {% include "footer.html" %}

    <script defer src="/assets/js/nav.js"></script>

    <!--
        This script adds a class to the body after scrolling 100px
        and we used these body.scroll styles to create some on scroll
        animations with the navbar
    -->
    <script defer>
      document.addEventListener("scroll", (e) => {
        const scroll = document.documentElement.scrollTop;
        if (scroll >= 100) {
          document.querySelector("body").classList.add("scroll");
        } else {
          document.querySelector("body").classList.remove("scroll");
        }
      });
    </script>

    <!--
        Lead / conversion tracking. Fires GA4 events that should be
        marked as Key Events in GA4 admin and imported into Google Ads
        as the conversion source.
        - generate_lead: fires when any form with class "lead-form" is submitted
        - phone_click:   fires when a tel: link is clicked
        - email_click:   fires when a mailto: link is clicked
    -->
    <script defer>
      document.addEventListener("DOMContentLoaded", function () {
        function track(name, params) {
          if (typeof gtag === "function") {
            gtag("event", name, params || {});
          }
        }

        // Form submissions
        document.querySelectorAll("form.lead-form").forEach(function (form) {
          form.addEventListener("submit", function () {
            track("generate_lead", {
              form_id: form.id || "",
              form_name: form.getAttribute("name") || "",
              form_location: form.dataset.formLocation || location.pathname,
              page_path: location.pathname,
            });
          });
        });

        // Phone + email click tracking
        document.addEventListener("click", function (e) {
          var a = e.target.closest("a");
          if (!a) return;
          var href = a.getAttribute("href") || "";
          if (href.indexOf("tel:") === 0) {
            track("phone_click", {
              phone_number: href.replace("tel:", ""),
              link_text: (a.textContent || "").trim().slice(0, 50),
              page_path: location.pathname,
            });
          } else if (href.indexOf("mailto:") === 0) {
            track("email_click", {
              email: href.replace("mailto:", ""),
              page_path: location.pathname,
            });
          }
        });
      });
    </script>
  </body>
</html>
