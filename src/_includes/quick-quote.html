<!-- ============================================ -->
<!--             Inline Quick Quote               -->
<!-- ============================================ -->

<section id="quick-quote-770">
  <div class="cs-container">
    <div class="cs-content">
      <span class="cs-topper">Free Estimate</span>
      <h2 class="cs-title">
        Get Your <span style="color: #0082f3">Free</span> Drainage Estimate
      </h2>
      <p class="cs-text">
        Tell us about your project and we'll get back to you within one business day.
        Or call <a href="tel:{{ client.phone }}" class="cs-inline-phone">{{ client.phoneFormatted }}</a>
        to talk to us now.
      </p>
    </div>

    <form
      class="cs-form lead-form"
      id="cs-quick-quote"
      name="Quick Quote"
      data-form-location="{{ tagTitle }}-inline"
      action="https://www.formbackend.com/f/568b7885e4662056"
      enctype="multipart/form-data"
      method="POST"
    >
      <label class="cs-label">
        Name
        <input
          class="cs-input"
          required
          type="text"
          name="name"
          placeholder="Your name"
          autocomplete="name"
        />
      </label>
      <label class="cs-label">
        Phone
        <input
          class="cs-input"
          required
          type="tel"
          name="phone"
          placeholder="(555) 555-5555"
          autocomplete="tel"
        />
      </label>
      <label class="cs-label">
        Email
        <input
          class="cs-input"
          required
          type="email"
          name="email"
          placeholder="you@example.com"
          autocomplete="email"
        />
      </label>
      <label class="cs-label">
        Zip code
        <input
          class="cs-input"
          required
          type="text"
          name="zip"
          placeholder="55379"
          autocomplete="postal-code"
          inputmode="numeric"
          pattern="[0-9]{5}"
        />
      </label>
      <label class="cs-label cs-message">
        Briefly describe your drainage issue
        <textarea
          class="cs-input cs-textarea"
          required
          name="Message"
          placeholder="e.g. Water pooling near foundation, sump pump running constantly..."
          rows="3"
        ></textarea>
      </label>
      <input type="hidden" name="source_page" value="{{ page.url }}" />
      <button class="cs-submit" type="submit">Get My Free Estimate</button>
    </form>
  </div>
</section>
